server.address=127.0.0.1
server.port=19080
spring.datasource.url=jdbc:h2:mem:healthbridge_classroom_demo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
file.upload-dir=target/classroom-demo-uploads
healthbridge.public-frontend-base-url=${CLASSROOM_PUBLIC_URL}
healthbridge.cors.allowed-origins=${CLASSROOM_PUBLIC_URL},http://127.0.0.1:19443
logging.level.root=WARN
spring.mvc.log-request-details=false
server.tomcat.accesslog.enabled=false
