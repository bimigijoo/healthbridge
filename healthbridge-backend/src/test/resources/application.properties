spring.datasource.url=jdbc:h2:mem:healthbridge_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=test-jwt-secret-key-must-be-at-least-32-chars
jwt.expiration=3600000

file.upload-dir=target/test-uploads
logging.level.org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration=ERROR
