server.address=127.0.0.1
server.port=18080
spring.datasource.url=jdbc:h2:mem:healthbridge_mobile_e2e;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
jwt.secret=synthetic-mobile-e2e-key-at-least-32-bytes
jwt.expiration=3600000
file.upload-dir=target/mobile-e2e-uploads
healthbridge.public-frontend-base-url=https://localhost:18443
logging.level.root=WARN
