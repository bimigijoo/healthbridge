# ==========================================
# HEALTHBRIDGE - APPLICATION CONFIGURATION
# ==========================================


# ==========================================
# DATABASE CONFIGURATION
# ==========================================

# Uses local PostgreSQL by default.
# On Render, DB_URL will point to the cloud PostgreSQL database.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/healthbridge}

spring.datasource.username=${DB_USERNAME:postgres}

spring.datasource.password=${DB_PASSWORD}


# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================

# Temporary setting for development.
# We will configure controlled schema initialization
# before deploying to Render.

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# JWT AUTHENTICATION
# ==========================================

# JWT_SECRET must be configured as an
# environment variable.

jwt.secret=${JWT_SECRET}

# Token expiration: 24 hours

jwt.expiration=86400000


# ==========================================
# FILE UPLOAD CONFIGURATION
# ==========================================

# Local file storage.
# Cloud deployment requires persistent storage
# if uploaded files must survive redeployments.

file.upload-dir=uploads/medical-documents

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=11MB


# ==========================================
# PUBLIC FRONTEND / QR CONFIGURATION
# ==========================================

# Set this to the permanent Vercel frontend URL
# after deploying the frontend.

healthbridge.public-frontend-base-url=${PUBLIC_FRONTEND_BASE_URL:}


# ==========================================
# CORS CONFIGURATION
# ==========================================

# Local development origins are allowed by default.
# On Render, CORS_ALLOWED_ORIGINS must include
# the deployed Vercel frontend domain.

healthbridge.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}


# ==========================================
# SERVER CONFIGURATION
# ==========================================

# Render assigns a PORT environment variable.
# Local development defaults to port 8080.

server.port=${PORT:8080}


# ==========================================
# SECURITY / LOGGING
# ==========================================

# Avoid logging sensitive request details.

spring.mvc.log-request-details=false

# ==========================================
# ADMIN BOOTSTRAP CONFIGURATION
# ==========================================

healthbridge.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
healthbridge.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
healthbridge.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}