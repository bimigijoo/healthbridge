spring.datasource.url=jdbc:postgresql://localhost:5432/healthbridge
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

file.upload-dir=uploads/medical-documents

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

healthbridge.public-frontend-base-url=${PUBLIC_FRONTEND_BASE_URL:}
healthbridge.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
spring.mvc.log-request-details=false
